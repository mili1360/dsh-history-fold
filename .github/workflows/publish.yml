name: publish

# Publishes to npm through OIDC (npm's "trusted publishing"): no token, no 2FA prompt.
# GitHub mints a short-lived identity for this job, npm verifies it against the trusted
# publisher configured for the package, and the credential expires when the job ends.
#
# Two entry points, deliberately separated:
#   - push a v* tag   -> tests + package verification only. A tag must never depend on registry
#                        credentials, otherwise every release is red until npm is reachable.
#   - manual dispatch -> the actual publish. Run it once the package's trusted publisher (or an
#                        NPM_TOKEN secret) is configured on npmjs.com.
#
# NOTE: OIDC publish only works for a package that ALREADY exists on npm. The very first publish
# has to happen once with a token or `npm login`; after that this job takes over.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm version
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      # 只跑不依赖 DSH 宿主的三套（fold/profile/edge/ratio 需要真的 DSH 环境，
      # 在 Ubuntu runner 上跑会假失败，反而挡住发布）。
      - name: test
        run: |
          node test/recall-tests.mjs
          node test/rare-tests.mjs
          node test/notes-tests.mjs

      # 模型必须真的进包：漏了它闸门会静默降级，用户装完以为有、其实没有。
      - name: verify package contents
        run: |
          node -e "const p=require('./package.json'); if(!p.files.includes('model')) { console.error('model/ missing from package.json files'); process.exit(1) }"
          test -f model/gate-model.json
          npm pack --dry-run

  publish:
    # Only on a manual run — a tag must not require registry credentials.
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: npm version
        run: npm install -g npm@latest

      - name: publish
        run: npm publish --access public
